<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧通勤風險系統 - 儀表板</title>
    <!-- Chart.js 圖表庫 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
            line-height: 1.6;
        }

        /* 導覽列 RWD */
        header {
            background-color: #1a252f;
            color: #fff;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        header h1 {
            font-size: 1.5rem;
        }

        /* 主要容器 RWD Grid */
        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
        }

        /* 桌機雙欄排版 */
        @media (min-width: 768px) {
            .container {
                grid-template-columns: 1fr 2fr;
            }
        }

        .card {
            background: #fff;
            border-radius: 8px;
            padding: 1.5rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .card h2 {
            font-size: 1.25rem;
            margin-bottom: 1rem;
            border-bottom: 2px solid #3498db;
            padding-bottom: 0.5rem;
            color: #2c3e50;
        }

        /* 1. 最新消息樣式 */
        .news-list {
            list-style: none;
        }

        .news-item {
            padding: 0.8rem 0;
            border-bottom: 1px solid #eee;
        }

        .news-item:last-child {
            border-bottom: none;
        }

        .news-date {
            font-size: 0.85rem;
            color: #7f8c8d;
            display: block;
        }

        .news-title {
            color: #2980b9;
            text-decoration: none;
            font-weight: 500;
        }

        .news-title:hover {
            text-decoration: underline;
        }

        /* 2. 圖表容器 RWD */
        .chart-container {
            position: relative;
            width: 100%;
            height: 300px;
        }

        .db-badge {
            display: inline-block;
            background-color: #27ae60;
            color: white;
            font-size: 0.75rem;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            margin-left: 0.5rem;
        }

        footer {
            text-align: center;
            padding: 1.5rem;
            background: #1a252f;
            color: #fff;
            margin-top: 2rem;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>🚗 智慧通勤風險通知系統</h1>
        <span>桃園地區即時儀表板</span>
    </header>

    <div class="container">
        <!-- 區塊 1：最新消息 (News) -->
        <section class="card">
            <h2>📢 最新消息</h2>
            <ul class="news-list">
                <li class="news-item">
                    <span class="news-date">2026-09-21</span>
                    <a href="#" class="news-title">系統正式上線，支援 Telegram 即時廣播提醒！</a>
                </li>
                <li class="news-item">
                    <span class="news-date">2026-09-20</span>
                    <a href="#" class="news-title">新增 AQI 空氣品質監測與降雨提醒門檻。</a>
                </li>
                <li class="news-item">
                    <span class="news-date">2026-09-18</span>
                    <a href="#" class="news-title">GitHub Actions 每日上午 07:00 排程設定完成。</a>
                </li>
            </ul>
        </section>

        <!-- 區塊 2：未來連接 MySQL 資料庫之圖表 -->
        <section class="card">
            <h2>📊 近 7 日降雨機率與 AQI 趨勢 <span class="db-badge">預留 MySQL 介面</span></h2>
            <div class="chart-container">
                <canvas id="weatherChart"></canvas>
            </div>
        </section>
    </div>

    <footer>
        <p>&copy; 2026 智慧通勤風險通知系統 | Hosted on GitHub Pages</p>
    </footer>

    <script>
        // 初始化 Chart.js 趨勢圖
        const ctx = document.getElementById('weatherChart').getContext('2d');
        const weatherChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['週一', '週二', '週三', '週四', '週五', '週六', '週日'],
                datasets: [
                    {
                        label: '降雨機率 (%)',
                        data: [20, 15, 65, 40, 10, 50, 51],
                        borderColor: '#3498db',
                        backgroundColor: 'rgba(52, 152, 219, 0.1)',
                        fill: true,
                        tension: 0.3
                    },
                    {
                        label: 'AQI 指數',
                        data: [45, 50, 85, 110, 75, 60, 90],
                        borderColor: '#e67e22',
                        backgroundColor: 'transparent',
                        borderDash: [5, 5],
                        tension: 0.3
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: {
                        beginAtZero: true
                    }
                }
            }
        });

        /* 
         * 未來連接 MySQL 資料庫的 API Fetch 預留邏輯範例：
         * 
         * async function loadDataFromMySQL() {
         *     const response = await fetch('https://your-api-domain.com/api/get_weather_logs');
         *     const data = await response.json();
         *     weatherChart.data.labels = data.dates;
         *     weatherChart.data.datasets[0].data = data.rain_data;
         *     weatherChart.data.datasets[1].data = data.aqi_data;
         *     weatherChart.update();
         * }
         */
    </script>
</body>
</html>
